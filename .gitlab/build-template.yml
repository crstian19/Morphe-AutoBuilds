# Shared job templates for the Morphe-AutoBuilds GitLab mirror.
# Included by .gitlab-ci.yml and the generated build-child.yml.

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

.morphe-base:
  image: python:3.11
  cache:
    - key:
        files: [requirements.txt]
      paths: [.cache/pip]
    - key: "temurin-jre-21"
      paths: [.cache/java21]
  before_script:
    - pip install -q -r requirements.txt
    - |
      if [ ! -x .cache/java21/bin/java ]; then
        echo "Installing Temurin JRE 21..."
        apt-get update -qq && apt-get install -y -qq wget > /dev/null
        mkdir -p .cache/java21 /tmp/jdl
        wget -q -O /tmp/jdl/jre.tar.gz "https://api.adoptium.net/v3/binary/latest/21/ga/linux/x64/jre/hotspot/normal/eclipse"
        tar -xzf /tmp/jdl/jre.tar.gz -C .cache/java21 --strip-components=1
      fi
    - export PATH="$CI_PROJECT_DIR/.cache/java21/bin:$PATH"
    - java -version 2>&1 | head -1

.morphe-build:
  extends: .morphe-base
  services:
    - name: ghcr.io/germondai/trawl:latest
      alias: trawl
  variables:
    TRAWL_URL: "http://trawl:8191"
  script:
    - echo "Building $APP_NAME with $SOURCE for $ARCH..."
    - python -m src
    - |
      mkdir -p build_records
      for apk in *.apk; do
        [ -e "$apk" ] || continue
        APK_PATH="$apk" python scripts/record_build.py || true
      done
  artifacts:
    paths: ["*.apk", "build_records/"]
    expire_in: 1 day
  # Build jobs must not take down the whole child pipeline; the release job
  # publishes whatever succeeded.
  allow_failure: true

.morphe-release:
  extends: .morphe-base
  script:
    - python scripts/validate_gitlab_auth.py
    - |
      mkdir -p release-apks build_records
      # Collect APKs from all build jobs' artifacts
      find . -maxdepth 3 -name "*.apk" -not -path "./release-apks/*" -exec cp -f {} release-apks/ \; 2>/dev/null || true
      # Merge build records into manifest.json (best-effort)
      find . -maxdepth 4 -path "*build_records/*.json" -exec cp -f {} build_records/ \; 2>/dev/null || true
      # Fetch the planning manifest stashed by the parent pipeline
      python3 -c "from src import gitlab_api; gitlab_api.download_package_file('new_manifest.json', 'new_manifest.json', package='morphe-meta', version='latest')"
      python scripts/merge_manifest.py || { echo "merge_manifest failed; continuing"; rm -f manifest.json; }
      [ -f manifest.json ] && cp manifest.json release-apks/manifest.json || true
      ls -la release-apks/
    - python scripts/gitlab_publish_release.py --apks-dir release-apks --tag latest
