# Morphe-AutoBuilds on GitLab CI — full mirror of the GitHub Actions workflows.
#
# - Scheduled daily build: check-updates -> child pipeline (build matrix) -> release
# - Manual single-app build: run a pipeline from the web UI with variables:
#     APP_NAME (required), SOURCE (required), VERSION (optional), ARCH (optional)
#
# Required CI/CD variables (Settings > CI/CD > Variables):
#   GITLAB_RELEASE_TOKEN : project access token with `api` scope (masked)
#   MORPHE_PLATFORM      : set to "gitlab" (defined below)
# Also add a Pipeline Schedule (Build > Pipeline schedules) for the daily run.

include:
  - local: '.gitlab/build-template.yml'

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: always

stages:
  - check
  - build
  - manual

variables:
  MORPHE_PLATFORM: "gitlab"

# ---------------------------------------------------------------------------
# Scheduled / full build: plan which apps need rebuilding, then fan out.
# ---------------------------------------------------------------------------
check-updates:
  stage: check
  extends: .morphe-base
  script:
    - python scripts/validate_gitlab_auth.py
    - python scripts/check_app_updates.py
    - python scripts/gitlab_child_pipeline.py
  artifacts:
    reports:
      dotenv: build.env
    paths:
      - build-child.yml
      - build_matrix.json
      - carry_over.json
      - new_manifest.json
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true

trigger-builds:
  stage: build
  trigger:
    include:
      - artifact: build-child.yml
        job: check-updates
    strategy: depend
  rules:
    - if: $HAS_UPDATES == "true"

# ---------------------------------------------------------------------------
# Manual single-app build (mirrors manual-patch.yml).
# Run from Build > Pipelines > Run pipeline and set:
#   APP_NAME, SOURCE, optionally VERSION and ARCH.
# ---------------------------------------------------------------------------
manual-build:
  stage: manual
  extends: .morphe-build
  allow_failure: false
  variables:
    ARCH: "$ARCH"
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $APP_NAME && $SOURCE
      when: manual
  before_script:
    - !reference [.morphe-base, before_script]
    - |
      if [ -n "$VERSION" ]; then
        for dir in apps/apkmirror apps/apkpure apps/uptodown apps/github; do
          cfg="$dir/$APP_NAME.json"
          if [ -f "$cfg" ]; then
            echo "Pinning $cfg to version $VERSION"
            python3 -c "import json; p='$cfg'; c=json.load(open(p)); c['version']='$VERSION'; json.dump(c, open(p, 'w'), indent=2)"
            break
          fi
        done
      fi
  script:
    - echo "Building $APP_NAME with $SOURCE for ${ARCH:-universal}..."
    - python -m src
    - |
      mkdir -p release-apks
      cp -f *.apk release-apks/ 2>/dev/null || true
      ls -la release-apks/
    - python scripts/gitlab_publish_release.py --apks-dir release-apks --tag latest --merge
  after_script:
    - |
      if [ -n "$VERSION" ]; then
        for dir in apps/apkmirror apps/apkpure apps/uptodown apps/github; do
          cfg="$dir/$APP_NAME.json"
          if [ -f "$cfg" ]; then
            python3 -c "import json; p='$cfg'; c=json.load(open(p)); c['version']=''; json.dump(c, open(p, 'w'), indent=2)"
            break
          fi
        done
      fi
