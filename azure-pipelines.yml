# Morphe-AutoBuilds on Azure Pipelines
# Daily auto-build of patched APKs, uploaded to Codeberg releases.
# This keeps GitHub free of APK binaries (DMCA-safe).

trigger: none

schedules:
- cron: "0 6 * * *"
  displayName: Daily 6 AM UTC build
  branches:
    include:
    - main
  always: true

parameters:
- name: force_full_rebuild
  displayName: Rebuild every app (ignore incremental check)
  type: boolean
  default: false

variables:
- group: morphe-secrets  # Contains: CODEBERG_TOKEN
- name: CODEBERG_OWNER
  value: 'RookieZ'
- name: CODEBERG_REPO
  value: 'Morphe-Releases'

stages:
# ---------------------------------------------------------------------------
# Stage 1: Check which apps need rebuilding
# ---------------------------------------------------------------------------
- stage: CheckUpdates
  displayName: Check for Updates
  jobs:
  - job: check
    displayName: Incremental Update Check
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self
      persistCredentials: true

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'

    - script: |
        pip install -r requirements.txt
        pip install requests beautifulsoup4
      displayName: Install Dependencies

    - script: |
        python scripts/check_app_updates.py
      displayName: Run Incremental Update Check
      env:
        FORCE_FULL_REBUILD: ${{ parameters.force_full_rebuild }}

    - task: PublishBuildArtifacts@1
      inputs:
        pathToPublish: 'build_matrix.json'
        artifactName: 'build-plan'
      displayName: Publish Build Plan
      condition: always()

# ---------------------------------------------------------------------------
# Stage 2: Build each app in parallel (matrix)
# ---------------------------------------------------------------------------
- stage: Build
  displayName: Build Applications
  dependsOn: CheckUpdates
  condition: succeeded()
  jobs:
  - job: build_apps
    displayName: Build APKs
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      maxParallel: 10
      matrix:
        # Matrix is populated dynamically - see note below
        placeholder:
          app_name: 'placeholder'
    steps:
    - checkout: self

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'

    - script: |
        pip install -r requirements.txt
        pip install requests beautifulsoup4
      displayName: Install Dependencies

    - task: JavaToolInstaller@0
      inputs:
        versionSpec: '21'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'
      displayName: Setup Java 21

    # Trawl service for Cloudflare bypass (replaces GitHub Actions services)
    - script: |
        docker run -d --name trawl --shm-size=1gb -p 8191:8191 ghcr.io/germondai/trawl:latest
        sleep 10
        curl -s http://localhost:8191/ > /dev/null && echo "Trawl ready" || echo "Trawl may not be ready"
      displayName: Start Trawl Service

    - script: |
        echo "Building $(APP_NAME) with $(SOURCE)..."
        python -m src
      displayName: Build APK
      env:
        APP_NAME: $(app_name)
        SOURCE: $(source)
        ARCH: $(arch)
        TRAWL_URL: http://localhost:8191

    - script: |
        mkdir -p build_records
        for apk in *.apk; do
          [ -e "$apk" ] || continue
          APK_PATH="$apk" python scripts/record_build.py || true
        done
        ls -la build_records/ 2>/dev/null || echo "(no records)"
      displayName: Record Build Outputs
      condition: always()

    - task: PublishBuildArtifacts@1
      inputs:
        pathToPublish: '$(Build.SourcesDirectory)'
        artifactName: 'apk-$(app_name)-$(source)'
        artifactType: 'pipeline'
      displayName: Publish APK Artifact
      condition: always()

# ---------------------------------------------------------------------------
# Stage 3: Upload all APKs to Codeberg releases
# ---------------------------------------------------------------------------
- stage: Publish
  displayName: Publish to Codeberg
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: upload
    displayName: Upload to Codeberg Releases
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'

    - task: DownloadPipelineArtifact@2
      inputs:
        artifactName: 'apk-*'
        targetPath: '$(Pipeline.Workspace)/all-apks'
      displayName: Download All APK Artifacts

    - script: |
        pip install requests
      displayName: Install Dependencies

    - script: |
        python scripts/codeberg_publish.py \
          --token "$(CODEBERG_TOKEN)" \
          --owner "$(CODEBERG_OWNER)" \
          --repo "$(CODEBERG_REPO)" \
          --tag "latest" \
          --apk-dir "$(Pipeline.Workspace)/all-apks"
      displayName: Upload APKs to Codeberg Release
      env:
        CODEBERG_TOKEN: $(CODEBERG_TOKEN)
